name: Verify workshop
on:
  push:
    paths:
      - '**/*.java'
      - '**/pom.xml'
      - 'tools/**'
      - '.github/workflows/verify.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  java-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Maven build and unit tests
        run: mvn -B -ntp clean verify
      - name: Compile standalone load tool for Java 17
        run: javac --release 17 -d .ci-classes tools/LabLoad.java
      - name: Start real services and verify HTTP behavior
        run: python tools/verify-runtime.py
      - name: Keep logs and CSV evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.os }}
          path: reports/
          if-no-files-found: ignore
