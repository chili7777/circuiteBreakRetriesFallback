apiVersion: apps/v1
kind: Deployment
metadata: {name: payment-service}
spec:
  replicas: 2
  selector: {matchLabels: {app: payment-service}}
  template:
    metadata: {labels: {app: payment-service}}
    spec:
      containers:
        - name: payment
          image: YOUR_REGISTRY/payment-service:lab
          ports: [{containerPort: 8081}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: 8081}, initialDelaySeconds: 5, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: 8081}, initialDelaySeconds: 15, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: payment-service}
spec:
  selector: {app: payment-service}
  ports: [{port: 8081, targetPort: 8081}]
