apiVersion: apps/v1
kind: Deployment
metadata: {name: orders-service}
spec:
  replicas: 2
  selector: {matchLabels: {app: orders-service}}
  template:
    metadata: {labels: {app: orders-service}}
    spec:
      containers:
        - name: orders
          image: YOUR_REGISTRY/orders-service:lab
          ports: [{containerPort: 8080}]
          env: [{name: PAYMENT_BASE_URL, value: http://payment-service:8081}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: 8080}, initialDelaySeconds: 5, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: 8080}, initialDelaySeconds: 15, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: orders-service}
spec:
  selector: {app: orders-service}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: orders-service}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: orders-service}
  minReplicas: 2
  maxReplicas: 6
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
